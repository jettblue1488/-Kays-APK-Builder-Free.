name: Build Kays Forensics Android APK
on:
  workflow_dispatch:
  push:
    branches: [kays-chat-forensics]
    paths: ['forensics/**', '.github/workflows/build-chat-forensics.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK for Rust
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          rustup target add aarch64-linux-android
      - name: Build upstream chat4n6 for arm64 Android
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SecurityRonin/chat4n6.git /tmp/chat4n6
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cd /tmp/chat4n6
          cargo build --release --locked --target aarch64-linux-android -p chat4n6 --bin chat4n6
          mkdir -p "$GITHUB_WORKSPACE/forensics/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/chat4n6 "$GITHUB_WORKSPACE/forensics/app/src/main/jniLibs/arm64-v8a/libchat4n6.so"
          file "$GITHUB_WORKSPACE/forensics/app/src/main/jniLibs/arm64-v8a/libchat4n6.so"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: forensics
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify copyright and full MIT license are in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find forensics/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -p "$APK" assets/chat4n6-LICENSE.txt | cmp - forensics/THIRD_PARTY_LICENSE.txt
          grep -Fq 'Copyright (c) 2026 SecurityRonin' forensics/THIRD_PARTY_LICENSE.txt
          grep -Fq 'Permission is hereby granted, free of charge' forensics/THIRD_PARTY_LICENSE.txt
          cp forensics/THIRD_PARTY_LICENSE.txt forensics/app/build/outputs/apk/debug/THIRD_PARTY_LICENSE.txt
      - name: Verify installable APK signature and Android package ID
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find forensics/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='com.kay.forensics.autoscan'"
          unzip -t "$APK" | tail -n 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kays-Forensics-Android-APK
          path: forensics/app/build/outputs/apk/debug/*
          if-no-files-found: error
