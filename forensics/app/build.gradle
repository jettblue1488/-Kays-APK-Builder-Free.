plugins { id 'com.android.application' }
android {
    namespace 'com.kay.chatforensics'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kay.forensics.extractions'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add("**/libchat4n6.so")
        }
    }
}
